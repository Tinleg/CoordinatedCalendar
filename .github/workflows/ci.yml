name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Actions minutes are free for public repositories; skip while the repository is private.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: swift test
      - name: Build release
        run: swift build -c release
