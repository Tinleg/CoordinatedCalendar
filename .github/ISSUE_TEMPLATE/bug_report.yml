name: Bug report
description: Something syncs wrongly, fails, or doesn't work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't paste real event titles, attendees or account names; the diagnostics report below already hides them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: |
        In the app: **Status → Copy Diagnostics**, then paste here. From Terminal: `/Applications/CoordinatedCalendar.app/Contents/MacOS/CoordinatedCalendar --diagnostics`.
        Calendar and account names are replaced with labels and event titles are removed. Read it before posting.
      render: text
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you installed it
      options:
        - Downloaded the disk image from a release
        - Built from source
    validations:
      required: true
  - type: textarea
    id: calendars
    attributes:
      label: Kinds of accounts involved
      description: For example iCloud, Google, Exchange / Microsoft 365, subscribed. Only the kinds, not the names.
